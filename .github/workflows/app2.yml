name: Build Best BD Book APK v2
on:
  workflow_dispatch:
    inputs:
      site_url:
        description: "আপনার সাইটের ঠিকানা (যেমন https://yourname.blogspot.com)"
        required: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"
      - name: Create project files
        env:
          SITE_URL: ${{ github.event.inputs.site_url }}
        run: |
          mkdir -p .
          cat > settings.gradle <<'EOF_0'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "BestBDBook"
          include ':app'
          EOF_0
          mkdir -p .
          cat > build.gradle <<'EOF_1'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          EOF_1
          mkdir -p .
          cat > gradle.properties <<'EOF_2'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          EOF_2
          mkdir -p app
          cat > app/build.gradle <<'EOF_3'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.bestbdbook.app'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.bestbdbook.app'
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          EOF_3
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <application
                  android:label="Best BD Book"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:largeHeap="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_4
          mkdir -p app/src/main/java/com/bestbdbook/app
          cat > app/src/main/java/com/bestbdbook/app/MainActivity.kt <<'EOF_5'
          package com.bestbdbook.app

          import android.app.Activity
          import android.app.AlertDialog
          import android.content.Context
          import android.content.Intent
          import android.content.res.ColorStateList
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.Outline
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.ColorMatrixColorFilter
          import android.graphics.drawable.GradientDrawable
          import android.graphics.pdf.PdfRenderer
          import android.net.ConnectivityManager
          import android.net.Uri
          import android.os.Bundle
          import android.text.Editable
          import android.text.TextWatcher
          import android.text.style.ForegroundColorSpan
          import android.os.ParcelFileDescriptor
          import android.util.LruCache
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.view.ViewOutlineProvider
          import android.webkit.CookieManager
          import android.webkit.WebResourceError
          import android.webkit.WebResourceRequest
          import android.webkit.WebSettings
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.AbsListView
          import android.widget.BaseAdapter
          import android.widget.Button
          import android.widget.EditText
          import android.widget.FrameLayout
          import android.widget.HorizontalScrollView
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ListView
          import android.widget.ProgressBar
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import java.io.File
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLDecoder
          import org.json.JSONObject
          import org.json.JSONTokener

          const val SITE = "__SITE_URL__"

          class MainActivity : Activity() {
              private lateinit var web: WebView
              private lateinit var libView: ScrollView
              private lateinit var libList: LinearLayout
              private lateinit var reader: LinearLayout
              private lateinit var holder: HorizontalScrollView
              private lateinit var listV: ListView
              private lateinit var pageT: TextView
              private lateinit var zlT: TextView
              private lateinit var rdTop: View
              private lateinit var rdNav: View
              private lateinit var rdFl: View
              private var rdFs = false
              private var snapMode = false
              private val snapHome: File by lazy { File(filesDir, "snap_home.html") }
              private val coverDir: File by lazy { File(filesDir, "covers").also { it.mkdirs() } }
              private val coverCache = LruCache<String, Bitmap>(24)
              private val META_JS = "(function(){try{var i=document.querySelector('.bk-cover img');var h=document.querySelector('h1.bk-title');var m=document.querySelector(\"meta[property='og:image']\");var im=i?(i.currentSrc||i.src):(m?m.content:'');var t=h?h.textContent.trim():(document.title||'');return JSON.stringify({t:t,i:im})}catch(e){return ''}})()"
              private lateinit var bar: LinearLayout
              private lateinit var navBtns: List<Button>
              private val navTabs = listOf("home", "search", "dl", "me", "menu")
              private val navNames = listOf("হোম", "সার্চ", "ডাউনলোড", "অ্যাকাউন্ট", "মেনু")
              private val navColors = listOf("#4D9BFF", "#26C6B0", "#4CC35F", "#C26BE0", "#EEF3FB")
              private val navIcons = listOf(R.drawable.ic_home, R.drawable.ic_search, R.drawable.ic_download, R.drawable.ic_me, R.drawable.ic_menu)
              private val navColorsL = listOf("#1A73E8", "#00897B", "#2E7D32", "#9C27B0", "#12182B")
              private var light = false
              private lateinit var rootV: LinearLayout
              private var profList: String? = null
              private var curTab = "home"
              private var qText = ""
              private var searchBox: EditText? = null
              private var rowsBox: LinearLayout? = null
              private var pdf: PdfRenderer? = null
              private var pfd: ParcelFileDescriptor? = null
              private var curFile: File? = null
              private var curPage = 1
              private var zoom = 1.0f
              private var night = false
              private var failed = false
              private val cache = LruCache<Int, Bitmap>(3)
              private val dir: File by lazy { File(filesDir, "books").also { it.mkdirs() } }
              private val sp by lazy { getSharedPreferences("bbb", MODE_PRIVATE) }
              private val siteHost: String by lazy { (Uri.parse(SITE).host ?: "").removePrefix("www.") }
              private val nightF = ColorMatrixColorFilter(floatArrayOf(
                  -1f, 0f, 0f, 0f, 255f,
                  0f, -1f, 0f, 0f, 255f,
                  0f, 0f, -1f, 0f, 255f,
                  0f, 0f, 0f, 1f, 0f))
              private val MATCH = ViewGroup.LayoutParams.MATCH_PARENT
              private val WRAP = ViewGroup.LayoutParams.WRAP_CONTENT

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()
              private fun toast(t: String) { Toast.makeText(this, t, Toast.LENGTH_LONG).show() }
              private fun pageW(): Int = (resources.displayMetrics.widthPixels * zoom).toInt()
              private fun bn(s: String): String {
                  val sb = StringBuilder()
                  for (ch in s) { sb.append(if (ch in '0'..'9') "০১২৩৪৫৬৭৮৯"[ch - '0'] else ch) }
                  return sb.toString()
              }

              @Suppress("DEPRECATION")
              private fun online(): Boolean {
                  val cm = getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                  val n = cm.activeNetworkInfo
                  return n != null && n.isConnected
              }

              private fun btn(t: String, f: () -> Unit): Button {
                  val b = Button(this)
                  b.text = t
                  b.setTextColor(Color.WHITE)
                  b.setBackgroundColor(Color.TRANSPARENT)
                  b.minWidth = 0
                  b.minimumWidth = 0
                  b.setPadding(dp(12), 0, dp(12), 0)
                  b.setOnClickListener { f() }
                  return b
              }

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  light = sp.getBoolean("light", false)
                  night = sp.getBoolean("rn", false)
                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  rootV = root
                  root.setBackgroundColor(cBg())
                  val frame = FrameLayout(this)
                  web = WebView(this)
                  libView = ScrollView(this)
                  libView.visibility = View.GONE
                  libView.setBackgroundColor(cBg())
                  libList = LinearLayout(this)
                  libList.orientation = LinearLayout.VERTICAL
                  libList.setPadding(dp(12), dp(12), dp(12), dp(12))
                  libView.addView(libList)
                  reader = LinearLayout(this)
                  reader.orientation = LinearLayout.VERTICAL
                  reader.visibility = View.GONE
                  frame.addView(web, FrameLayout.LayoutParams(MATCH, MATCH))
                  frame.addView(libView, FrameLayout.LayoutParams(MATCH, MATCH))
                  frame.addView(reader, FrameLayout.LayoutParams(MATCH, MATCH))
                  root.addView(frame, LinearLayout.LayoutParams(MATCH, 0, 1f))
                  bar = LinearLayout(this)
                  bar.orientation = LinearLayout.HORIZONTAL
                  val nb = ArrayList<Button>()
                  for (i in 0 until 5) {
                      val tn = navTabs[i]
                      val b = nav { onNav(tn) }
                      nb.add(b)
                      bar.addView(b, LinearLayout.LayoutParams(0, WRAP, 1f))
                  }
                  navBtns = nb
                  bar.background = makeBarBg()
                  root.addView(bar, LinearLayout.LayoutParams(MATCH, WRAP))
                  setContentView(root)
                  setupWeb()
                  refreshBtn()
                  goSite("home")
              }

              private fun nav(f: () -> Unit): Button {
                  val b = btn("", f)
                  b.textSize = 11f
                  b.isAllCaps = false
                  b.setPadding(0, dp(8), 0, dp(6))
                  return b
              }

              private fun onNav(t: String) {
                  if (t == "dl") tabLib() else goSite(t)
              }

              private fun refreshBtn() {
                  for (i in 0 until 5) {
                      val b = navBtns[i]
                      val c = Color.parseColor(if (light) navColorsL[i] else navColors[i])
                      b.text = navNames[i]
                      val d = getDrawable(navIcons[i])!!.mutate()
                      d.setTint(c)
                      b.setCompoundDrawablesWithIntrinsicBounds(null, d, null, null)
                      b.compoundDrawablePadding = dp(2)
                      b.setTextColor(c)
                      b.alpha = if (navTabs[i] == curTab) 1f else 0.62f
                  }
              }

              private fun isHome(): Boolean {
                  if (snapMode) return false
                  val u = web.url ?: return false
                  val p = Uri.parse(u).path ?: ""
                  val h = Uri.parse(u).host ?: ""
                  return h.endsWith(siteHost) && (p == "" || p == "/")
              }

              private fun siteTab(t: String) {
                  libView.visibility = View.GONE
                  web.visibility = View.VISIBLE
                  if (!online() && (t == "home" || t == "menu") && loadSnap(t)) return
                  val wasSnap = snapMode
                  snapMode = false
                  web.settings.cacheMode = if (online()) WebSettings.LOAD_DEFAULT else WebSettings.LOAD_CACHE_ELSE_NETWORK
                  if (!wasSnap && isHome() && !failed) {
                      web.evaluateJavascript("(function(){var b=document.querySelector('#bbb .nav-item[data-t=\"" + t + "\"]');if(b)b.click()})()", null)
                  } else {
                      failed = false
                      web.loadUrl(if (t == "home") SITE else SITE.trimEnd('/') + "/#" + t)
                  }
              }

              private fun goSite(t: String) {
                  curTab = t
                  if (online()) syncProfile()
                  if (!online() && (t == "search" || t == "me")) {
                      web.visibility = View.GONE
                      libView.visibility = View.VISIBLE
                      if (t == "me") {
                          profList = null
                          buildProfile()
                      } else {
                          buildLib()
                          searchBox?.requestFocus()
                      }
                  } else {
                      siteTab(t)
                  }
                  refreshBtn()
              }

              private fun tabLib() {
                  curTab = "dl"
                  web.visibility = View.GONE
                  libView.visibility = View.VISIBLE
                  buildLib()
                  refreshBtn()
              }

              private fun syncProfile() {
                  if (web.url == null) return
                  val js = "(function(){try{var s=localStorage.getItem('bbb_sess');if(!s)return JSON.stringify({s:''});var u=(JSON.parse(localStorage.getItem('bbb_users')||'{}')||{})[s]||{};var d=JSON.parse(localStorage.getItem('bbb_data_'+s)||'{}')||{};var o={s:s,n:u.n||'',L:{}};['rd','dl','lib','bmk','hist'].forEach(function(k){o.L[k]=(d[k]||[]).slice(0,60).map(function(x){return x.t||''});o[k]=(d[k]||[]).length});return JSON.stringify(o)}catch(e){return ''}})()"
                  web.evaluateJavascript(js) { r ->
                      try {
                          if (r != null && r != "null") {
                              val v = JSONTokener(r).nextValue()
                              if (v is String && v.isNotEmpty()) sp.edit().putString("prof", v).apply()
                          }
                      } catch (e: Exception) { }
                  }
              }

              private fun injectCss(v: WebView) {
                  val css = "html body #bbb .bottom-nav,html body #bbbp .bp-nav,html body #bbbp[data-bk] .bp-nav{display:none!important}"
                  v.evaluateJavascript("(function(){if(document.getElementById('appcss')||!document.head)return;var s=document.createElement('style');s.id='appcss';s.textContent='" + css + "';document.head.appendChild(s)})()", null)
              }

              private fun setupWeb() {
                  val s = web.settings
                  s.javaScriptEnabled = true
                  s.domStorageEnabled = true
                  s.setSupportMultipleWindows(false)
                  s.cacheMode = WebSettings.LOAD_DEFAULT
                  CookieManager.getInstance().setAcceptCookie(true)
                  web.webViewClient = object : WebViewClient() {
                      override fun shouldOverrideUrlLoading(v: WebView, r: WebResourceRequest): Boolean {
                          val u = r.url
                          if (u.scheme == "bbbapp") { handleApp(u); return true }
                          val h = u.host ?: ""
                          if (u.scheme == "http" || u.scheme == "https") {
                              if (h.endsWith(siteHost) || h.contains("google.com") || h.contains("googleusercontent.com") || h.contains("blogger.com")) return false
                          }
                          try { startActivity(Intent(Intent.ACTION_VIEW, u)) } catch (e: Exception) { }
                          return true
                      }
                      override fun onPageStarted(v: WebView, url: String?, f: Bitmap?) {
                          super.onPageStarted(v, url, f)
                          injectCss(v)
                      }
                      override fun onPageFinished(v: WebView, url: String?) {
                          super.onPageFinished(v, url)
                          injectCss(v)
                          syncProfile()
                          if (snapMode) snapJs(v) else if (isHome()) v.postDelayed({ captureHome() }, 6000)
                      }
                      override fun onReceivedError(v: WebView, r: WebResourceRequest, e: WebResourceError) {
                          if (r.isForMainFrame) {
                              failed = true
                              tabLib()
                          }
                      }
                  }
                  web.setDownloadListener { url, ua, cd, mime, _ -> startDownload(url, ua, cd, mime) }
              }

              private fun fileName(cd: String?): String {
                  var n = ""
                  if (cd != null) {
                      val m1 = Regex("filename\\*\\s*=\\s*[Uu][Tt][Ff]-8''([^;]+)").find(cd)
                      if (m1 != null) {
                          n = try { URLDecoder.decode(m1.groupValues[1].trim(), "UTF-8") } catch (e: Exception) { "" }
                      }
                      if (n.isEmpty()) {
                          val m2 = Regex("filename\\s*=\\s*\"?([^\";]+)\"?").find(cd)
                          if (m2 != null) n = m2.groupValues[1].trim()
                      }
                  }
                  if (n.isEmpty()) n = "book-" + System.currentTimeMillis()
                  n = n.replace(Regex("[\\\\/:*?\"<>|]"), "_")
                  if (!n.lowercase().endsWith(".pdf")) n += ".pdf"
                  return n
              }

              private fun startDownload(url: String, ua: String?, cd: String?, mime: String?) {
                  toast("⬇️ ডাউনলোড শুরু হচ্ছে…")
                  val pageUrl = web.url ?: ""
                  web.evaluateJavascript(META_JS) { r ->
                      var title = ""
                      var img = ""
                      try {
                          if (r != null && r != "null") {
                              val v = JSONTokener(r).nextValue()
                              if (v is String && v.isNotEmpty()) {
                                  val o = JSONObject(v)
                                  title = o.optString("t")
                                  img = o.optString("i")
                              }
                          }
                      } catch (e: Exception) { }
                      doDownload(url, ua, cd, pageUrl, title, img)
                  }
              }

              private fun doDownload(url: String, ua: String?, cd: String?, pageUrl: String, title: String, img: String) {
                  Thread {
                      try {
                          val c = URL(url).openConnection() as HttpURLConnection
                          c.instanceFollowRedirects = true
                          c.connectTimeout = 20000
                          c.readTimeout = 60000
                          if (ua != null) c.setRequestProperty("User-Agent", ua)
                          val ck = CookieManager.getInstance().getCookie(url)
                          if (ck != null) c.setRequestProperty("Cookie", ck)
                          c.connect()
                          if (c.responseCode !in 200..299) throw Exception("HTTP " + c.responseCode)
                          val name = fileName(c.getHeaderField("Content-Disposition") ?: cd)
                          val tmp = File(dir, "$name.part")
                          c.inputStream.use { i -> tmp.outputStream().use { o -> i.copyTo(o) } }
                          val head = ByteArray(5)
                          tmp.inputStream().use { it.read(head) }
                          if (String(head) != "%PDF-") { tmp.delete(); throw Exception("ফাইলটি PDF নয়") }
                          val dest = File(dir, name)
                          if (dest.exists()) dest.delete()
                          tmp.renameTo(dest)
                          val meta = JSONObject()
                          meta.put("t", title)
                          meta.put("i", img)
                          meta.put("u", pageUrl)
                          val ed = sp.edit().putString("m_" + name, meta.toString())
                          val pth = (Uri.parse(pageUrl).path ?: "").trimEnd('/')
                          if (pth.length > 1) ed.putString("u_" + pth, name)
                          ed.apply()
                          if (img.startsWith("http")) {
                              try {
                                  val cc = URL(img).openConnection() as HttpURLConnection
                                  cc.connectTimeout = 15000
                                  cc.readTimeout = 30000
                                  cc.inputStream.use { i -> File(coverDir, name + ".img").outputStream().use { o -> i.copyTo(o) } }
                              } catch (e: Exception) { }
                          }
                          coverCache.remove(name)
                          runOnUiThread {
                              toast("✅ সংরক্ষিত হয়েছে — “ডাউনলোড” পেজে অফলাইনে পড়তে পারবেন")
                              refreshBtn()
                              if (libView.visibility == View.VISIBLE) buildLib()
                          }
                      } catch (e: Exception) {
                          runOnUiThread { toast("❌ ডাউনলোড হয়নি: " + (e.message ?: "")) }
                      }
                  }.start()
              }

              private fun bookTitle(f: File): String {
                  val m = sp.getString("m_" + f.name, null)
                  if (m != null) {
                      try {
                          val t = JSONObject(m).optString("t")
                          if (t.isNotEmpty()) return t
                      } catch (e: Exception) { }
                  }
                  return f.name.removeSuffix(".pdf")
              }

              private fun forgetBook(f: File) {
                  val m = sp.getString("m_" + f.name, null)
                  val ed = sp.edit().remove("p_" + f.name).remove("t_" + f.name).remove("ts_" + f.name).remove("m_" + f.name)
                  if (m != null) {
                      try {
                          val pth = (Uri.parse(JSONObject(m).optString("u")).path ?: "").trimEnd('/')
                          if (pth.length > 1) ed.remove("u_" + pth)
                      } catch (e: Exception) { }
                  }
                  ed.apply()
                  File(coverDir, f.name + ".img").delete()
                  coverCache.remove(f.name)
              }

              private fun coverBmp(f: File): Bitmap? {
                  val key = f.name
                  val hit = coverCache.get(key)
                  if (hit != null) return hit
                  val cf = File(coverDir, key + ".img")
                  if (!cf.exists()) return null
                  return try {
                      val o = BitmapFactory.Options()
                      o.inJustDecodeBounds = true
                      BitmapFactory.decodeFile(cf.path, o)
                      var ss = 1
                      while (o.outWidth / (ss * 2) >= dp(116)) ss *= 2
                      val o2 = BitmapFactory.Options()
                      o2.inSampleSize = ss
                      val bm = BitmapFactory.decodeFile(cf.path, o2)
                      if (bm != null) coverCache.put(key, bm)
                      bm
                  } catch (e: Throwable) {
                      null
                  }
              }

              private fun captureHome() {
                  if (!online() || snapMode || !isHome()) return
                  val js = "(function(){try{if(location.hash&&location.hash!=='#')return '';var c=document.documentElement.cloneNode(true);var x=c.querySelectorAll('script,noscript,iframe,#appcss');for(var i=0;i<x.length;i++){x[i].parentNode.removeChild(x[i])}return '<!DOCTYPE html>'+c.outerHTML}catch(e){return ''}})()"
                  web.evaluateJavascript(js) { r ->
                      try {
                          if (r != null && r != "null") {
                              val v = JSONTokener(r).nextValue()
                              if (v is String && v.length > 30000) snapHome.writeText(v)
                          }
                      } catch (e: Exception) { }
                  }
              }

              private fun loadSnap(t: String): Boolean {
                  if (!snapHome.exists()) return false
                  var html: String
                  try { html = snapHome.readText() } catch (e: Exception) { return false }
                  if (t == "menu") html = html.replace(Regex("(<div[^>]*\\bid=\"mpg\"[^>]*?)\\s+hidden(=\"[^\"]*\")?"), "\$1")
                  snapMode = true
                  failed = false
                  web.settings.cacheMode = WebSettings.LOAD_CACHE_ELSE_NETWORK
                  web.loadDataWithBaseURL(SITE.trimEnd('/') + "/", html, "text/html", "UTF-8", null)
                  return true
              }

              private fun snapJs(v: WebView) {
                  v.evaluateJavascript("(function(){if(window.__bbbs)return;window.__bbbs=1;document.addEventListener('click',function(e){var m=e.target.closest('[data-act]');if(m){e.preventDefault();e.stopPropagation();location.href='bbbapp://tab/'+m.getAttribute('data-act');return}var c=e.target.closest('[data-bu]');var u=c?c.getAttribute('data-bu'):'';if(!u){var a=e.target.closest('a[href]');if(a)u=a.href}if(u){e.preventDefault();e.stopPropagation();location.href='bbbapp://open?u='+encodeURIComponent(u)}},true)})()", null)
              }

              private fun handleApp(u: Uri) {
                  val host = u.host ?: ""
                  if (host == "tab") {
                      val act = u.lastPathSegment ?: ""
                      if (act.contains("home")) goSite("home")
                      else if (act.contains("search")) goSite("search")
                      else if (act.contains("down") || act == "dl") tabLib()
                      else if (act.contains("acc") || act.contains("prof") || act == "me") goSite("me")
                      else toast("এই অপশনের জন্য ইন্টারনেট দরকার")
                  } else if (host == "open") {
                      val target = u.getQueryParameter("u") ?: ""
                      val pth = (Uri.parse(target).path ?: "").trimEnd('/')
                      val nm = if (pth.length > 1) sp.getString("u_" + pth, null) else null
                      val f = if (nm != null) File(dir, nm) else null
                      if (f != null && f.exists()) openPdf(f) else toast("এই বইটি ডাউনলোড করা নেই — ইন্টারনেট চালু করে খুলুন")
                  }
              }

              private fun files(): List<File> {
                  val l = dir.listFiles { f -> f.name.endsWith(".pdf") } ?: return emptyList()
                  return l.sortedByDescending { it.lastModified() }
              }

              private fun cBg(): Int = Color.parseColor(if (light) "#F4F7FC" else "#0B1020")
              private fun cPanel(): Int = Color.parseColor(if (light) "#FFFFFF" else "#141B30")
              private fun cTx(): Int = Color.parseColor(if (light) "#12182B" else "#F4F6FF")
              private fun cMut(): Int = Color.parseColor(if (light) "#5B6785" else "#AAB4D0")
              private fun cLine(): Int = Color.parseColor(if (light) "#E2E5EC" else "#212634")

              private fun boxBg(r: Int, fill: Int, stroke: Boolean): GradientDrawable {
                  val g = GradientDrawable()
                  g.setColor(fill)
                  g.cornerRadius = dp(r).toFloat()
                  if (stroke) g.setStroke(dp(1), cLine())
                  return g
              }

              private fun makeBarBg(): GradientDrawable {
                  val g = GradientDrawable()
                  g.setColor(if (light) Color.WHITE else Color.parseColor("#0C1122"))
                  g.setStroke(dp(1), cLine())
                  val rr = dp(18).toFloat()
                  g.cornerRadii = floatArrayOf(rr, rr, rr, rr, 0f, 0f, 0f, 0f)
                  return g
              }

              private fun toggleTheme() {
                  light = !light
                  sp.edit().putBoolean("light", light).apply()
                  rootV.setBackgroundColor(cBg())
                  libView.setBackgroundColor(cBg())
                  bar.background = makeBarBg()
                  if (web.url != null) web.evaluateJavascript("try{localStorage.setItem('bbbt2','" + (if (light) "1" else "0") + "')}catch(e){}", null)
                  refreshBtn()
                  if (libView.visibility == View.VISIBLE) {
                      if (curTab == "me") buildProfile() else buildLib()
                  }
              }

              private fun askDelete(f: File) {
                  AlertDialog.Builder(this)
                      .setMessage("“" + bookTitle(f) + "” মুছে ফেলবেন?")
                      .setPositiveButton("মুছুন") { _, _ ->
                          f.delete()
                          forgetBook(f)
                          buildLib()
                          refreshBtn()
                      }
                      .setNegativeButton("না", null)
                      .show()
              }

              private fun label(t: String): TextView {
                  val l = TextView(this)
                  l.text = t
                  l.setTextColor(cMut())
                  l.textSize = 13f
                  l.setPadding(0, dp(6), 0, dp(8))
                  return l
              }

              private fun rowLp(): LinearLayout.LayoutParams {
                  val lp = LinearLayout.LayoutParams(MATCH, WRAP)
                  lp.bottomMargin = dp(10)
                  return lp
              }

              private fun bookRow(f: File): View {
                  val title = bookTitle(f)
                  val pg = sp.getInt("p_" + f.name, 0)
                  val tot = sp.getInt("t_" + f.name, 0)
                  val pct = if (tot > 0 && pg > 0) pg * 100 / tot else 0
                  val mb = String.format("%.1f", f.length() / 1048576.0)
                  val row = LinearLayout(this)
                  row.orientation = LinearLayout.HORIZONTAL
                  row.gravity = Gravity.CENTER_VERTICAL
                  row.setPadding(dp(10), dp(10), dp(10), dp(10))
                  row.background = boxBg(14, cPanel(), true)
                  val bmp = coverBmp(f)
                  val cvv: View
                  if (bmp != null) {
                      val iv = ImageView(this)
                      iv.setImageBitmap(bmp)
                      iv.scaleType = ImageView.ScaleType.CENTER_CROP
                      iv.clipToOutline = true
                      iv.outlineProvider = object : ViewOutlineProvider() {
                          override fun getOutline(v: View, outline: Outline) { outline.setRoundRect(0, 0, v.width, v.height, dp(8).toFloat()) }
                      }
                      cvv = iv
                  } else {
                      val cv = TextView(this)
                      cv.text = title.trim().take(1).uppercase()
                      cv.gravity = Gravity.CENTER
                      cv.setTextColor(Color.WHITE)
                      cv.textSize = 24f
                      val hue = ((title.hashCode() and 0x7fffffff) % 360).toFloat()
                      val cbg = GradientDrawable()
                      cbg.setColor(Color.HSVToColor(floatArrayOf(hue, 0.6f, 0.55f)))
                      cbg.cornerRadius = dp(8).toFloat()
                      cv.background = cbg
                      cvv = cv
                  }
                  row.addView(cvv, LinearLayout.LayoutParams(dp(58), dp(80)))
                  val mid = LinearLayout(this)
                  mid.orientation = LinearLayout.VERTICAL
                  val t = TextView(this)
                  t.text = title
                  t.setTextColor(cTx())
                  t.textSize = 14f
                  t.maxLines = 2
                  t.ellipsize = android.text.TextUtils.TruncateAt.END
                  val sub = TextView(this)
                  sub.text = bn(mb) + " MB" + (if (pg > 1 && tot > 0) "  •  পৃষ্ঠা " + bn("$pg / $tot") else "")
                  sub.setTextColor(cMut())
                  sub.textSize = 12f
                  val pb = ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal)
                  pb.max = 100
                  pb.progress = pct
                  pb.progressTintList = ColorStateList.valueOf(Color.parseColor("#FFC43D"))
                  pb.progressBackgroundTintList = ColorStateList.valueOf(cLine())
                  mid.addView(t)
                  mid.addView(sub)
                  val pbl = LinearLayout.LayoutParams(MATCH, dp(6))
                  pbl.topMargin = dp(8)
                  mid.addView(pb, pbl)
                  val ml = LinearLayout.LayoutParams(0, WRAP, 1f)
                  ml.leftMargin = dp(12)
                  row.addView(mid, ml)
                  val del = btn("\uD83D\uDDD1") { askDelete(f) }
                  del.setTextColor(cTx())
                  row.addView(del)
                  row.setOnClickListener { openPdf(f) }
                  row.setOnLongClickListener { askDelete(f); true }
                  return row
              }

              private fun fillRows() {
                  val box = rowsBox ?: return
                  box.removeAllViews()
                  val q = qText.trim().lowercase()
                  val all = files()
                  val shown = all.filter { q.isEmpty() || it.name.lowercase().contains(q) }
                  if (q.isEmpty()) {
                      val cont = all.filter { sp.getInt("p_" + it.name, 0) > 1 }.sortedByDescending { sp.getLong("ts_" + it.name, 0L) }.take(3)
                      if (cont.isNotEmpty()) {
                          box.addView(label("▶ পড়া চলছে"))
                          for (f in cont) box.addView(bookRow(f), rowLp())
                      }
                      box.addView(label("\uD83D\uDCDA সব ডাউনলোড"))
                  }
                  if (shown.isEmpty()) box.addView(label("কোনো বই মেলেনি"))
                  for (f in shown) box.addView(bookRow(f), rowLp())
              }

