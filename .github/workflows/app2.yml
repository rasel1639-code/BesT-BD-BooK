              private fun buildProfile() {
                  libList.removeAllViews()
                  val keys = listOf("rd", "dl", "lib", "bmk", "hist")
                  val names = listOf("পড়া চলছে", "ডাউনলোড", "লাইব্রেরী", "বুকমার্ক", "হিস্টরি")
                  val icons = listOf(R.drawable.ic_r_rd, R.drawable.ic_r_dl, R.drawable.ic_r_lib, R.drawable.ic_r_bmk, R.drawable.ic_r_hist)
                  val pl = profList
                  val top = LinearLayout(this)
                  top.orientation = LinearLayout.HORIZONTAL
                  top.gravity = Gravity.CENTER_VERTICAL
                  top.setPadding(0, 0, 0, dp(18))
                  val x = TextView(this)
                  x.text = if (pl == null) "✕" else "←"
                  x.gravity = Gravity.CENTER
                  x.setTextColor(cTx())
                  x.textSize = 18f
                  x.background = boxBg(12, cPanel(), true)
                  x.setOnClickListener {
                      if (profList != null) { profList = null; buildProfile() } else goSite("home")
                  }
                  top.addView(x, LinearLayout.LayoutParams(dp(40), dp(40)))
                  val ttl = TextView(this)
                  ttl.text = if (pl == null) "অ্যাকাউন্ট" else names[keys.indexOf(pl)]
                  ttl.gravity = Gravity.CENTER
                  ttl.setTextColor(cTx())
                  ttl.textSize = 18f
                  ttl.typeface = Typeface.DEFAULT_BOLD
                  top.addView(ttl, LinearLayout.LayoutParams(0, WRAP, 1f))
                  top.addView(View(this), LinearLayout.LayoutParams(dp(40), dp(40)))
                  libList.addView(top)
                  val raw = sp.getString("prof", "") ?: ""
                  val o: JSONObject? = try { if (raw.isNotEmpty()) JSONObject(raw) else null } catch (e: Exception) { null }
                  if (o == null || o.optString("s").isEmpty()) {
                      val c0 = card("\uD83D\uDC64 আপনি লগইন করেননি।\n\nলগইন করতে একবার ইন্টারনেট চালু করে “অ্যাকাউন্ট” চাপুন।")
                      libList.addView(c0)
                      return
                  }
                  if (pl != null) {
                      val arr = o.optJSONObject("L")?.optJSONArray(pl)
                      var n = 0
                      if (arr != null) {
                          for (i in 0 until arr.length()) {
                              val t = arr.optString(i)
                              if (t.isNotEmpty()) { libList.addView(card(t), rowLp()); n++ }
                          }
                      }
                      if (n == 0) libList.addView(label("তালিকা ফাঁকা বা এখনো জমানো হয়নি"))
                      return
                  }
                  val name = o.optString("n")
                  val box = LinearLayout(this)
                  box.orientation = LinearLayout.VERTICAL
                  box.setPadding(dp(16), dp(18), dp(16), dp(18))
                  box.background = boxBg(18, cPanel(), true)
                  val av = TextView(this)
                  av.text = name.trim().take(1).uppercase()
                  av.gravity = Gravity.CENTER
                  av.setTextColor(Color.WHITE)
                  av.textSize = 36f
                  av.typeface = Typeface.DEFAULT_BOLD
