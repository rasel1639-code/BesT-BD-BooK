                  val fl = LinearLayout(this)
                  fl.orientation = LinearLayout.HORIZONTAL
                  fl.addView(flBtn("−") { setZoom(zoom - 0.2f) }, LinearLayout.LayoutParams(dp(42), dp(42)).also { it.leftMargin = dp(8) })
                  fl.addView(flBtn("+") { setZoom(zoom + 0.2f) }, LinearLayout.LayoutParams(dp(42), dp(42)).also { it.leftMargin = dp(8) })
                  fl.addView(flBtn("✕") { rdFs = false; applyFs() }, LinearLayout.LayoutParams(dp(42), dp(42)).also { it.leftMargin = dp(8) })
                  val flp = FrameLayout.LayoutParams(WRAP, WRAP)
                  flp.gravity = Gravity.TOP or Gravity.END
                  flp.topMargin = dp(10)
                  flp.rightMargin = dp(10)
                  body.addView(fl, flp)
                  reader.addView(body, LinearLayout.LayoutParams(MATCH, 0, 1f))

                  val nav = LinearLayout(this)
                  nav.orientation = LinearLayout.HORIZONTAL
                  nav.setBackgroundColor(rPanel())
                  nav.addView(navItem("✕", "বন্ধ", 0xFFFF6B6B.toInt()) { closeReader() }, LinearLayout.LayoutParams(0, WRAP, 1f))
                  nav.addView(navItem("−", "জুম আউট", rTx()) { setZoom(zoom - 0.2f) }, LinearLayout.LayoutParams(0, WRAP, 1f))
                  zlT = navItem(bn((zoom * 100).toInt().toString()) + "%", "", rTx()) { }
                  zlT.textSize = 13f
                  nav.addView(zlT, LinearLayout.LayoutParams(0, WRAP, 1f))
                  nav.addView(navItem("+", "জুম ইন", rTx()) { setZoom(zoom + 0.2f) }, LinearLayout.LayoutParams(0, WRAP, 1f))
                  nav.addView(navItem("□", "ফুল পেজ", rTx()) { rdFs = true; applyFs() }, LinearLayout.LayoutParams(0, WRAP, 1f))
                  reader.addView(nav, LinearLayout.LayoutParams(MATCH, WRAP))
                  rdTop = top
                  rdNav = nav
                  rdFl = fl
                  applyFs()
              }

              private fun updPage(n: Int) {
                  curPage = n
                  pageT.text = bn("পৃষ্ঠা $n / " + (pdf?.pageCount ?: 0))
              }

              private fun saveProg() {
                  val f = curFile ?: return
                  if (pdf == null) return
                  sp.edit().putInt("p_" + f.name, curPage).putLong("ts_" + f.name, System.currentTimeMillis()).apply()
              }

              private fun openPdf(f: File) {
                  closePdf()
                  try {
                      pfd = ParcelFileDescriptor.open(f, ParcelFileDescriptor.MODE_READ_ONLY)
                      pdf = PdfRenderer(pfd!!)
                  } catch (e: Exception) {
                      closePdf()
                      toast("এই PDF টি খোলা যায়নি")
                      return
                  }
                  curFile = f
                  zoom = 1.0f
                  rdFs = false
                  cache.evictAll()
                  sp.edit().putInt("t_" + f.name, pdf!!.pageCount).apply()
                  fillReader()
                  listV.adapter = PA()
                  val saved = sp.getInt("p_" + f.name, 1)
                  listV.post { listV.setSelection(maxOf(0, saved - 1)) }
                  updPage(saved)
                  bar.visibility = View.GONE
                  reader.visibility = View.VISIBLE
              }

              private fun closePdf() {
                  try { pdf?.close() } catch (e: Exception) { }
                  try { pfd?.close() } catch (e: Exception) { }
                  pdf = null
                  pfd = null
                  cache.evictAll()
              }

              private fun closeReader() {
                  saveProg()
                  listV.adapter = null
                  closePdf()
                  curFile = null
                  rdFs = false
                  reader.visibility = View.GONE
                  bar.visibility = View.VISIBLE
                  buildLib()
                  refreshBtn()
              }

              private fun setZoom(z: Float) {
                  if (pdf == null) return
                  val pos = listV.firstVisiblePosition
                  zoom = z.coerceIn(0.8f, 1.8f)
                  zlT.text = bn((zoom * 100).toInt().toString()) + "%"
                  cache.evictAll()
                  listV.layoutParams = FrameLayout.LayoutParams(pageW(), MATCH)
                  (listV.adapter as? BaseAdapter)?.notifyDataSetChanged()
                  listV.setSelection(pos)
              }

              private fun toggleNight() {
                  night = !night
                  sp.edit().putBoolean("rn", night).apply()
                  val pos = maxOf(0, curPage - 1)
                  fillReader()
                  listV.adapter = PA()
                  listV.post { listV.setSelection(pos) }
                  updPage(curPage)
              }

              private fun render(p: Int, w: Int): Bitmap? {
                  val c = cache.get(p)
                  if (c != null) return c
                  val r = pdf ?: return null
                  return try {
                      val pg = r.openPage(p)
                      val h = (w * pg.height.toFloat() / pg.width).toInt()
                      val bm = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                      bm.eraseColor(Color.WHITE)
                      pg.render(bm, null, null, PdfRenderer.Page.RENDER_MODE_FOR_DISPLAY)
                      pg.close()
                      cache.put(p, bm)
                      bm
                  } catch (e: Throwable) {
                      null
                  }
              }

              inner class PA : BaseAdapter() {
                  override fun getCount(): Int = pdf?.pageCount ?: 0
                  override fun getItem(p: Int): Any = p
                  override fun getItemId(p: Int): Long = p.toLong()
                  override fun getView(p: Int, cv: View?, parent: ViewGroup?): View {
                      val iv = (cv as? ImageView) ?: ImageView(this@MainActivity)
                      val w = pageW()
                      val bm = render(p, w)
                      iv.scaleType = ImageView.ScaleType.FIT_XY
                      if (night) { iv.colorFilter = nightF } else { iv.clearColorFilter() }
                      if (bm != null) {
                          iv.layoutParams = AbsListView.LayoutParams(w, bm.height)
                          iv.setImageBitmap(bm)
                      } else {
                          iv.layoutParams = AbsListView.LayoutParams(w, (w * 1.41f).toInt())
                          iv.setImageBitmap(null)
                      }
                      return iv
                  }
              }

              override fun onPause() {
                  super.onPause()
                  saveProg()
                  syncProfile()
                  CookieManager.getInstance().flush()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  closePdf()
              }

              @Suppress("DEPRECATION", "OVERRIDE_DEPRECATION")
              override fun onBackPressed() {
                  if (reader.visibility == View.VISIBLE) { if (rdFs) { rdFs = false; applyFs() } else closeReader() }
                  else if (libView.visibility == View.VISIBLE) { if (online()) goSite("home") else super.onBackPressed() }
                  else if (web.canGoBack()) web.goBack()
                  else super.onBackPressed()
              }
          }
