                  hello.gravity = Gravity.CENTER
                  hello.setTextColor(cTx())
                  hello.textSize = 18f
                  hello.typeface = Typeface.DEFAULT_BOLD
                  box.addView(hello)
                  val mail = TextView(this)
                  mail.text = o.optString("s")
                  mail.gravity = Gravity.CENTER
                  mail.setTextColor(cMut())
                  mail.textSize = 14f
                  mail.setPadding(0, dp(4), 0, dp(22))
                  box.addView(mail)
                  val menu = LinearLayout(this)
                  menu.orientation = LinearLayout.VERTICAL
                  menu.background = boxBg(14, Color.TRANSPARENT, true)
                  for (i in 0 until 5) {
                      val row = LinearLayout(this)
                      row.orientation = LinearLayout.HORIZONTAL
                      row.gravity = Gravity.CENTER_VERTICAL
                      row.setPadding(dp(12), dp(13), dp(12), dp(13))
                      val ib = ImageView(this)
                      val d = getDrawable(icons[i])!!.mutate()
                      d.setTint(cTx())
                      ib.setImageDrawable(d)
                      ib.setPadding(dp(8), dp(8), dp(8), dp(8))
                      ib.background = boxBg(11, cBg(), false)
                      row.addView(ib, LinearLayout.LayoutParams(dp(36), dp(36)))
                      val rt = TextView(this)
                      rt.text = names[i]
                      rt.setTextColor(cTx())
                      rt.textSize = 15f
                      rt.typeface = Typeface.DEFAULT_BOLD
                      rt.setPadding(dp(12), 0, 0, 0)
                      row.addView(rt, LinearLayout.LayoutParams(0, WRAP, 1f))
                      val rc = TextView(this)
                      rc.text = bn(o.optInt(keys[i]).toString())
                      rc.setTextColor(cMut())
                      rc.textSize = 13f
                      row.addView(rc)
                      val rg = TextView(this)
                      rg.text = "  ›"
