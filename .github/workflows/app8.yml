                  libView.visibility = View.GONE
                  web.visibility = View.VISIBLE
                  if (!online() && (t == "home" || t == "menu")) {
                      if (snapMode && snapKind == t && web.url != null) {
                          web.scrollTo(0, 0)
                      } else if (!loadSnap(t)) {
                          toast(tr("হোম পেজের অফলাইন কপি এখনো নেই — একবার ইন্টারনেট চালু করে হোম পেজ খুলুন", "No offline copy of the home page yet — open the home page once with internet"))
                          tabLib()
                      }
                      return
                  }
                  val wasSnap = snapMode
                  snapMode = false
                  web.settings.cacheMode = if (online()) WebSettings.LOAD_DEFAULT else WebSettings.LOAD_CACHE_ELSE_NETWORK
                  if (!wasSnap && isHome() && !failed) {
                      web.evaluateJavascript("(function(){var b=document.querySelector('#bbb .nav-item[data-t=\"" + t + "\"]');if(b)b.click()})()", null)
                  } else {
                      failed = false
                      web.loadUrl(if (t == "home") SITE else SITE.trimEnd('/') + "/#" + t)
                  }
              }

