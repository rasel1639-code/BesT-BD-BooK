                      if (n == 0) libList.addView(label(tr("তালিকা ফাঁকা বা এখনো জমানো হয়নি", "This list is empty or not saved yet")))
                      return
                  }
                  val name = o.optString("n")
                  val box = LinearLayout(this)
                  box.orientation = LinearLayout.VERTICAL
                  box.setPadding(dp(16), dp(18), dp(16), dp(18))
                  box.background = boxBg(18, cPanel(), true)
