                  av.typeface = Typeface.DEFAULT_BOLD
                  val abg = GradientDrawable(GradientDrawable.Orientation.TL_BR, intArrayOf(0xFFFED787.toInt(), 0xFFF47F8B.toInt(), 0xFF805CF3.toInt()))
                  abg.shape = GradientDrawable.OVAL
                  av.background = abg
                  val alp = LinearLayout.LayoutParams(dp(84), dp(84))
                  alp.gravity = Gravity.CENTER_HORIZONTAL
                  alp.topMargin = dp(6)
                  alp.bottomMargin = dp(14)
                  box.addView(av, alp)
                  val hello = TextView(this)
                  hello.text = tr("স্বাগতম, ", "Welcome, ") + name
                  hello.gravity = Gravity.CENTER
                  hello.setTextColor(cTx())
                  hello.textSize = 18f
                  hello.typeface = Typeface.DEFAULT_BOLD
                  box.addView(hello)
                  val mail = TextView(this)
                  mail.text = o.optString("s")
                  mail.gravity = Gravity.CENTER
                  mail.setTextColor(cMut())
                  mail.textSize = 14f
                  mail.setPadding(0, dp(4), 0, dp(22))
                  box.addView(mail)
                  val menu = LinearLayout(this)
                  menu.orientation = LinearLayout.VERTICAL
                  menu.background = boxBg(14, Color.TRANSPARENT, true)
                  for (i in 0 until 5) {
                      val row = LinearLayout(this)
                      row.orientation = LinearLayout.HORIZONTAL
                      row.gravity = Gravity.CENTER_VERTICAL
