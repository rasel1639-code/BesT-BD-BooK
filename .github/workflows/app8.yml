                  top.addView(View(this), LinearLayout.LayoutParams(dp(40), dp(40)))
                  libList.addView(top)
                  val raw = sp.getString("prof", "") ?: ""
                  val o: JSONObject? = try { if (raw.isNotEmpty()) JSONObject(raw) else null } catch (e: Exception) { null }
                  if (o == null || o.optString("s").isEmpty()) {
                      val c0 = card(tr("\uD83D\uDC64 আপনি লগইন করেননি।\n\nলগইন করতে একবার ইন্টারনেট চালু করে “অ্যাকাউন্ট” চাপুন।", "\uD83D\uDC64 You are not logged in.\n\nTo log in, turn on internet once and tap “Account”."))
                      libList.addView(c0)
                      return
                  }
                  if (pl != null) {
                      val arr = o.optJSONObject("L")?.optJSONArray(pl)
                      var n = 0
