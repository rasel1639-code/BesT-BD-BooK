                  }
                  return row
              }

              private fun imgKey(u: String): String = Integer.toHexString(u.hashCode()) + "_" + u.length

              private fun cacheSnapAssets(html: String) {
                  if (imgBusy) return
                  val urls = LinkedHashSet<String>()
                  val pats = listOf(
                      Regex("(?:src|data-src|poster)=\"((?:https?:)?//[^\"]+)\""),
                      Regex("<link[^>]*href=\"((?:https?:)?//[^\"]+\\.css[^\"]*)\""),
                      Regex("url\\(['\"]?((?:https?:)?//[^)'\"]+)")
                  )
                  for (p in pats) {
                      for (m in p.findAll(html)) {
                          var u = m.groupValues[1].replace("&amp;", "&")
                          if (u.startsWith("//")) u = "https:" + u
                          urls.add(u)
                      }
                  }
                  imgBusy = true
                  Thread {
                      var n = 0
                      for (u in urls) {
                          if (n >= 160) break
                          val f = File(imgDir, imgKey(u))
                          if (f.exists()) continue
                          try {
                              val cc = URL(u).openConnection() as HttpURLConnection
                              cc.connectTimeout = 15000
                              cc.readTimeout = 30000
                              val tmp = File(imgDir, imgKey(u) + ".t")
                              cc.inputStream.use { i -> tmp.outputStream().use { o -> i.copyTo(o) } }
                              File(imgDir, imgKey(u) + ".m").writeText((cc.contentType ?: "image/jpeg").substringBefore(';').trim())
                              tmp.renameTo(f)
                              n++
                          } catch (e: Exception) { }
                      }
                      imgBusy = false
                  }.start()
              }

              private fun captureHome() {
                  if (!online() || snapMode || snapBusy || !isHome()) return
                  snapBusy = true
                  val prep = "(function(){try{if(location.hash&&location.hash!=='#')return '';var c=document.documentElement.cloneNode(true);var x=c.querySelectorAll('script,noscript,iframe,#appcss');for(var i=0;i<x.length;i++){x[i].parentNode.removeChild(x[i])}var h='<!DOCTYPE html>'+c.outerHTML;var m=c.querySelector('#mpg');if(m)m.removeAttribute('hidden');var mm='<!DOCTYPE html>'+c.outerHTML;window.__bbbS=[h,mm];return h.length+','+mm.length}catch(e){return ''}})()"
                  web.evaluateJavascript(prep) { r ->
                      val p = (r ?: "").trim('"').split(",")
                      val lh = if (p.size == 2) p[0].toIntOrNull() else null
                      val lm = if (p.size == 2) p[1].toIntOrNull() else null
                      if (lh != null && lm != null) {
                          pullSnap(0, lh, StringBuilder(), 0) { h ->
                              pullSnap(1, lm, StringBuilder(), 0) { m -> finishSnap(h, m) }
                          }
                      } else {
                          snapBusy = false
                      }
                  }
              }

              private fun pullSnap(idx: Int, total: Int, sb: StringBuilder, off: Int, done: (String) -> Unit) {
                  if (off >= total) {
                      done(sb.toString())
                      return
                  }
                  web.evaluateJavascript("(window.__bbbS&&window.__bbbS[" + idx + "]||'').substr(" + off + ",120000)") { r ->
                      try {
                          val v = if (r != null && r != "null") JSONTokener(r).nextValue() else null
                          if (v is String && v.isNotEmpty()) {
                              sb.append(v)
                              pullSnap(idx, total, sb, off + 120000, done)
                          } else {
                              snapBusy = false
                          }
                      } catch (e: Exception) {
                          snapBusy = false
                      }
                  }
              }

              private fun finishSnap(h: String, m: String) {
                  try {
                      if (h.length > 30000) {
                          val first = !snapHome.exists()
                          snapHome.writeText(h)
                          if (m.length > 30000) snapMenu.writeText(m)
                          cacheSnapAssets(h)
                          if (first) toast(tr("✓ অফলাইনের জন্য হোম পেজের কপি তৈরি হয়েছে", "✓ Home page saved for offline use"))
                      }
                  } catch (e: Exception) { }
                  snapBusy = false
                  web.evaluateJavascript("window.__bbbS=null", null)
              }

              private fun loadSnap(t: String): Boolean {
                  if (!snapHome.exists()) return false
                  val useMenuFile = (t == "menu" && snapMenu.exists())
                  var html = ""
                  try { html = (if (useMenuFile) snapMenu else snapHome).readText() } catch (e: Exception) { return false }
                  if (t == "menu" && !useMenuFile) html = html.replace(Regex("(<div[^>]*\\bid=\"mpg\"[^>]*?)\\s+hidden(=\"[^\"]*\")?"), "\$1")
                  snapMode = true
                  snapKind = t
                  failed = false
                  web.settings.cacheMode = WebSettings.LOAD_CACHE_ELSE_NETWORK
                  web.visibility = View.INVISIBLE
                  web.postDelayed({ if (snapMode && libView.visibility != View.VISIBLE) web.visibility = View.VISIBLE }, 1500)
                  web.loadDataWithBaseURL(SITE.trimEnd('/') + "/", html, "text/html", "UTF-8", null)
                  return true
              }

              private fun pushPrefs(v: WebView) {
                  val js = "(function(){try{var x='" + (if (light) "1" else "0") + "',n='" + (if (langEn) "1" else "0") + "';var cx=localStorage.getItem('bbbt2')||'0',cn=localStorage.getItem('bbbl2')||'0';if(cx!==x||cn!==n){localStorage.setItem('bbbt2',x);localStorage.setItem('bbbl2',n);return 'r'}return ''}catch(e){return ''}})()"
                  v.evaluateJavascript(js) { r ->
                      if (r == "\"r\"") {
                          quietUntil = System.currentTimeMillis() + 3500
                          v.reload()
                      }
                  }
              }

              private fun pollPrefs() {
                  if (web.visibility != View.VISIBLE || web.url == null) return
                  if (System.currentTimeMillis() < quietUntil) return
                  web.evaluateJavascript("(function(){try{if(!document.body)return '';return (document.body.classList.contains('lightm')?'1':'0')+(localStorage.getItem('bbbl2')==='1'?'1':'0')}catch(e){return ''}})()") { r ->
                      if (r != null && r.length == 4 && System.currentTimeMillis() >= quietUntil) {
                          val l = r[1] == '1'
                          val e = r[2] == '1'
                          if (l != light) setLight(l, false)
                          if (e != langEn) setLangApp(e, false)
                      }
                  }
              }

