              private fun bookRow(f: File): View {
                  val rawT = bookTitle(f)
                  val bpath = bookPath(f)
                  val lab = if (bpath.length > 1) labelFor(bpath) else ""
                  val au = authorOf(rawT, lab)
                  val title = cleanTitle(rawT, lab)
                  val pg = sp.getInt("p_" + f.name, 0)
                  val tot = sp.getInt("t_" + f.name, 0)
                  val pct = if (tot > 0 && pg > 0) pg * 100 / tot else 0
                  val mb = String.format("%.1f", f.length() / 1048576.0)
                  val row = LinearLayout(this)
                  row.orientation = LinearLayout.HORIZONTAL
                  row.gravity = Gravity.CENTER_VERTICAL
                  row.setPadding(dp(10), dp(10), dp(10), dp(10))
                  row.background = boxBg(14, cPanel(), true)
                  press(row, 14)
                  val bmp = coverBmp(f)
                  val cvv: View
                  if (bmp != null) {
                      val iv = ImageView(this)
                      iv.setImageBitmap(bmp)
                      iv.scaleType = ImageView.ScaleType.CENTER_CROP
                      iv.clipToOutline = true
                      iv.outlineProvider = object : ViewOutlineProvider() {
                          override fun getOutline(v: View, outline: Outline) { outline.setRoundRect(0, 0, v.width, v.height, dp(8).toFloat()) }
                      }
                      cvv = iv
                  } else {
                      val cv = TextView(this)
                      cv.text = title.trim().take(1).uppercase()
                      cv.gravity = Gravity.CENTER
                      cv.setTextColor(Color.WHITE)
                      cv.textSize = 24f
                      val hue = ((title.hashCode() and 0x7fffffff) % 360).toFloat()
                      val cbg = GradientDrawable()
                      cbg.setColor(Color.HSVToColor(floatArrayOf(hue, 0.6f, 0.55f)))
                      cbg.cornerRadius = dp(8).toFloat()
                      cv.background = cbg
                      cvv = cv
                  }
                  row.addView(cvv, LinearLayout.LayoutParams(dp(58), dp(80)))
                  val mid = LinearLayout(this)
                  mid.orientation = LinearLayout.VERTICAL
                  val t = TextView(this)
                  t.text = title
                  t.setTextColor(cTx())
                  t.textSize = 14f
                  t.maxLines = 2
                  t.ellipsize = android.text.TextUtils.TruncateAt.END
                  val sub = TextView(this)
                  sub.text = bn(mb) + " MB" + (if (pg > 1 && tot > 0) tr("  •  পৃষ্ঠা ", "  •  Page ") + bn("$pg / $tot") else "")
                  sub.setTextColor(cMut())
                  sub.textSize = 12f
                  val pb = ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal)
                  pb.max = 100
                  pb.progress = pct
                  pb.progressTintList = ColorStateList.valueOf(Color.parseColor("#FFC43D"))
                  pb.progressBackgroundTintList = ColorStateList.valueOf(cLine())
                  mid.addView(t)
                  if (au.isNotEmpty()) {
                      val at = TextView(this)
                      at.text = "✍ " + au
                      at.setTextColor(cMut())
                      at.textSize = 12.5f
                      at.maxLines = 1
                      at.ellipsize = android.text.TextUtils.TruncateAt.END
                      mid.addView(at)
                  }
                  mid.addView(sub)
                  val pbl = LinearLayout.LayoutParams(MATCH, dp(6))
                  pbl.topMargin = dp(8)
                  mid.addView(pb, pbl)
                  val ml = LinearLayout.LayoutParams(0, WRAP, 1f)
                  ml.leftMargin = dp(12)
                  row.addView(mid, ml)
                  val del = btn("\uD83D\uDDD1") { askDelete(f) }
                  del.setTextColor(cTx())
                  row.addView(del)
                  row.setOnClickListener { openPdf(f) }
                  row.setOnLongClickListener { askDelete(f); true }
                  return row
              }

              private fun fillRows() {
                  val box = rowsBox ?: return
                  box.removeAllViews()
                  val q = qText.trim().lowercase()
                  val all = files()
                  val shown = all.filter { q.isEmpty() || bookTitle(it).lowercase().contains(q) || it.name.lowercase().contains(q) }
                  var any = false
                  if (q.isEmpty()) {
                      val cont = all.filter { sp.getInt("p_" + it.name, 0) > 1 }.sortedByDescending { sp.getLong("ts_" + it.name, 0L) }.take(3)
                      if (cont.isNotEmpty()) {
                          box.addView(label(tr("▶ পড়া চলছে", "▶ Continue reading")))
                          for (f in cont) box.addView(bookRow(f), rowLp())
                          any = true
                      }
                      if (all.isNotEmpty()) box.addView(label(tr("\uD83D\uDCDA সব ডাউনলোড", "\uD83D\uDCDA All downloads")))
                  }
                  for (f in shown) {
                      box.addView(bookRow(f), rowLp())
                      any = true
                  }
                  val arr = prof()?.optJSONObject("L")?.optJSONArray("dl")
                  if (arr != null) {
                      val rest = ArrayList<JSONObject>()
                      for (i in 0 until arr.length()) {
                          val e = arr.optJSONObject(i) ?: continue
                          val tt = e.optString("t")
                          if (tt.isEmpty() || localFor(e.optString("u")) != null) continue
                          if (q.isNotEmpty() && !tt.lowercase().contains(q)) continue
                          rest.add(e)
                      }
                      if (rest.isNotEmpty()) {
                          box.addView(label(tr("☁ অ্যাকাউন্টের ডাউনলোড তালিকা", "☁ Account download list")))
                          for (e in rest) box.addView(entryRow(e, "dl"), rowLp())
                          any = true
                      }
                  }
                  if (!any) box.addView(label(tr("কোনো বই মেলেনি", "No books found")))
              }

