              private fun handleApp(u: Uri) {
                  val host = u.host ?: ""
                  if (host == "tab") {
                      val act = u.lastPathSegment ?: ""
                      if (act.contains("home")) goSite("home")
                      else if (act.contains("search")) goSite("search")
                      else if (act.contains("down") || act == "dl") tabLib()
                      else if (act.contains("acc") || act.contains("prof") || act == "me") goSite("me")
                      else if (act.contains("theme") || act.contains("dark") || act.contains("light") || act.contains("night")) toggleTheme()
                      else if (act.contains("lang")) setLangApp(!langEn, true)
                      else toast(tr("এই অপশনের জন্য ইন্টারনেট দরকার", "This option needs internet"))
                  } else if (host == "sync") {
                      quietUntil = 0L
                      pollPrefs()
                  } else if (host == "lang") {
                      val en = (u.lastPathSegment == "1")
                      if (en != langEn) setLangApp(en, false)
                  } else if (host == "theme") {
                      val l = (u.lastPathSegment == "1")
                      if (l != light) setLight(l, false)
                  } else if (host == "open") {
                      val target = u.getQueryParameter("u") ?: ""
                      val pth = (Uri.parse(target).path ?: "").trimEnd('/')
                      val nm = if (pth.length > 1) sp.getString("u_" + pth, null) else null
                      val f = if (nm != null) File(dir, nm) else null
                      if (f != null && f.exists()) openPdf(f) else toast("এই বইটি ডাউনলোড করা নেই — ইন্টারনেট চালু করে খুলুন")
                  }
              }

              private fun files(): List<File> {
                  val l = dir.listFiles { f -> f.name.endsWith(".pdf") } ?: return emptyList()
                  return l.sortedByDescending { it.lastModified() }
              }

