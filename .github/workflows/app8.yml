              private fun rBg(): Int = if (night) 0xFF05070D.toInt() else cBg()
              private fun rPanel(): Int = if (night) 0xFF0F1424.toInt() else cPanel()
              private fun rTx(): Int = if (night) 0xFFE8ECFF.toInt() else cTx()
              private fun rLine(): Int = if (night) 0xFF1B2238.toInt() else cLine()

              private fun rBox(): GradientDrawable {
                  val g = GradientDrawable()
                  g.setColor(rBg())
                  g.cornerRadius = dp(10).toFloat()
                  g.setStroke(dp(1), rLine())
                  return g
              }

              private fun navItem(ic: String, lb: String, col: Int, f: () -> Unit): TextView {
                  val t = TextView(this)
                  if (lb.isEmpty()) {
                      t.text = ic
                  } else {
                      val ss = android.text.SpannableString(ic + "\n" + lb)
                      ss.setSpan(android.text.style.RelativeSizeSpan(1.7f), 0, ic.length, 0)
                      t.text = ss
                  }
                  t.gravity = Gravity.CENTER
                  t.setTextColor(col)
                  t.textSize = 11f
                  t.setPadding(0, dp(8), 0, dp(8))
                  t.setOnClickListener { f() }
                  press(t, 0)
                  return t
              }

              private fun flBtn(t: String, f: () -> Unit): TextView {
                  val b = TextView(this)
                  b.text = t
                  b.gravity = Gravity.CENTER
                  b.setTextColor(Color.WHITE)
                  b.textSize = 20f
                  b.typeface = Typeface.DEFAULT_BOLD
                  val g = GradientDrawable()
                  g.setColor(0xE62F7BFF.toInt())
                  g.cornerRadius = dp(12).toFloat()
                  b.background = g
                  b.setOnClickListener { f() }
                  press(b, 12)
                  return b
              }

              private fun applyFs() {
                  rdTop.visibility = if (rdFs) View.GONE else View.VISIBLE
                  rdNav.visibility = if (rdFs) View.GONE else View.VISIBLE
                  rdFl.visibility = if (rdFs) View.VISIBLE else View.GONE
              }

              private fun fillReader() {
                  reader.removeAllViews()
                  reader.setBackgroundColor(rBg())
                  val top = LinearLayout(this)
                  top.orientation = LinearLayout.HORIZONTAL
                  top.gravity = Gravity.CENTER_VERTICAL
                  top.setPadding(dp(12), dp(8), dp(12), dp(8))
                  top.setBackgroundColor(rPanel())
                  val logo = ImageView(this)
                  logo.setImageResource(if (night || !light) R.drawable.logo_d else R.drawable.logo_l)
                  logo.adjustViewBounds = true
                  top.addView(logo, LinearLayout.LayoutParams(WRAP, dp(32)))
                  val br = TextView(this)
                  val sps = android.text.SpannableString("Best BD Book")
                  sps.setSpan(ForegroundColorSpan(0xFF5AA2FF.toInt()), 0, 8, 0)
                  sps.setSpan(ForegroundColorSpan(0xFF4ADE80.toInt()), 8, 12, 0)
                  br.text = sps
                  br.typeface = Typeface.create(Typeface.SERIF, Typeface.BOLD)
                  br.textSize = 16f
                  br.setPadding(dp(8), 0, 0, 0)
                  top.addView(br, LinearLayout.LayoutParams(0, WRAP, 1f))
                  pageT = TextView(this)
                  pageT.setTextColor(0xFFFFC43D.toInt())
                  pageT.textSize = 12f
                  pageT.gravity = Gravity.CENTER
                  pageT.setPadding(dp(12), 0, dp(12), 0)
                  pageT.background = rBox()
                  press(pageT, 10)
                  pageT.setOnClickListener {
                      saveProg()
                      toast(tr("পৃষ্ঠা ", "Page ") + bn(curPage.toString()) + tr(" সেভ হয়েছে", " saved"))
                  }
                  top.addView(pageT, LinearLayout.LayoutParams(WRAP, dp(36)))
                  val nbtn = ImageView(this)
                  val ic = getDrawable(if (night) R.drawable.ic_sun else R.drawable.ic_moon)!!.mutate()
                  ic.setTint(rTx())
                  nbtn.setImageDrawable(ic)
                  nbtn.setPadding(dp(8), dp(8), dp(8), dp(8))
                  nbtn.background = rBox()
                  press(nbtn, 10)
                  nbtn.setOnClickListener { toggleNight() }
                  val nlp = LinearLayout.LayoutParams(dp(36), dp(36))
                  nlp.leftMargin = dp(8)
                  top.addView(nbtn, nlp)
                  reader.addView(top, LinearLayout.LayoutParams(MATCH, WRAP))

                  val body = FrameLayout(this)
                  listV = ListView(this)
                  listV.divider = null
                  listV.dividerHeight = dp(8)
                  listV.setBackgroundColor(if (night) 0xFF111111.toInt() else 0xFFE9EDF4.toInt())
                  listV.setOnScrollListener(object : AbsListView.OnScrollListener {
                      override fun onScrollStateChanged(v: AbsListView?, s: Int) {
                          if (s == AbsListView.OnScrollListener.SCROLL_STATE_IDLE) saveProg()
                      }
                      override fun onScroll(v: AbsListView?, first: Int, vis: Int, tot: Int) { updPage(first + 1) }
                  })
                  holder = HorizontalScrollView(this)
                  holder.addView(listV, FrameLayout.LayoutParams(pageW(), MATCH))
                  body.addView(holder, FrameLayout.LayoutParams(MATCH, MATCH))
                  val fl = LinearLayout(this)
                  fl.orientation = LinearLayout.HORIZONTAL
                  fl.addView(flBtn("−") { setZoom(zoom - 0.2f) }, LinearLayout.LayoutParams(dp(42), dp(42)).also { it.leftMargin = dp(8) })
                  fl.addView(flBtn("+") { setZoom(zoom + 0.2f) }, LinearLayout.LayoutParams(dp(42), dp(42)).also { it.leftMargin = dp(8) })
                  fl.addView(flBtn("✕") { rdFs = false; applyFs() }, LinearLayout.LayoutParams(dp(42), dp(42)).also { it.leftMargin = dp(8) })
                  val flp = FrameLayout.LayoutParams(WRAP, WRAP)
                  flp.gravity = Gravity.TOP or Gravity.END
                  flp.topMargin = dp(10)
                  flp.rightMargin = dp(10)
                  body.addView(fl, flp)
                  reader.addView(body, LinearLayout.LayoutParams(MATCH, 0, 1f))

                  val nav = LinearLayout(this)
                  nav.orientation = LinearLayout.HORIZONTAL
                  nav.setBackgroundColor(rPanel())
                  nav.addView(navItem("✕", tr("বন্ধ", "Close"), 0xFFFF6B6B.toInt()) { closeReader() }, LinearLayout.LayoutParams(0, WRAP, 1f))
                  nav.addView(navItem("−", tr("জুম আউট", "Zoom out"), rTx()) { setZoom(zoom - 0.2f) }, LinearLayout.LayoutParams(0, WRAP, 1f))
                  zlT = navItem(bn((zoom * 100).toInt().toString()) + "%", "", rTx()) { }
                  zlT.textSize = 13f
                  nav.addView(zlT, LinearLayout.LayoutParams(0, WRAP, 1f))
                  nav.addView(navItem("+", tr("জুম ইন", "Zoom in"), rTx()) { setZoom(zoom + 0.2f) }, LinearLayout.LayoutParams(0, WRAP, 1f))
                  nav.addView(navItem("□", tr("ফুল পেজ", "Full page"), rTx()) { rdFs = true; applyFs() }, LinearLayout.LayoutParams(0, WRAP, 1f))
                  reader.addView(nav, LinearLayout.LayoutParams(MATCH, WRAP))
                  rdTop = top
                  rdNav = nav
                  rdFl = fl
                  applyFs()
              }

              private fun updPage(n: Int) {
                  curPage = n
                  pageT.text = bn(tr("পৃষ্ঠা ", "Page ") + "$n / " + (pdf?.pageCount ?: 0))
              }

              private fun saveProg() {
                  val f = curFile ?: return
                  if (pdf == null) return
                  sp.edit().putInt("p_" + f.name, curPage).putLong("ts_" + f.name, System.currentTimeMillis()).apply()
              }

              private fun openPdf(f: File) {
                  closePdf()
                  try {
                      pfd = ParcelFileDescriptor.open(f, ParcelFileDescriptor.MODE_READ_ONLY)
                      pdf = PdfRenderer(pfd!!)
                  } catch (e: Exception) {
                      closePdf()
                      toast("এই PDF টি খোলা যায়নি")
                      return
                  }
                  curFile = f
                  zoom = 1.0f
                  rdFs = false
                  cache.evictAll()
                  sp.edit().putInt("t_" + f.name, pdf!!.pageCount).apply()
                  fillReader()
                  listV.adapter = PA()
                  val saved = sp.getInt("p_" + f.name, 1)
                  listV.post { listV.setSelection(maxOf(0, saved - 1)) }
                  updPage(saved)
                  bar.visibility = View.GONE
                  reader.visibility = View.VISIBLE
              }

              private fun closePdf() {
                  try { pdf?.close() } catch (e: Exception) { }
                  try { pfd?.close() } catch (e: Exception) { }
                  pdf = null
                  pfd = null
                  cache.evictAll()
              }

              private fun closeReader() {
                  saveProg()
                  listV.adapter = null
                  closePdf()
                  curFile = null
                  rdFs = false
                  reader.visibility = View.GONE
                  bar.visibility = View.VISIBLE
                  if (libView.visibility == View.VISIBLE) {
                      if (curTab == "me") buildProfile() else buildLib()
                  }
                  refreshBtn()
              }

              private fun setZoom(z: Float) {
                  if (pdf == null) return
                  val pos = listV.firstVisiblePosition
                  zoom = z.coerceIn(0.8f, 1.8f)
                  zlT.text = bn((zoom * 100).toInt().toString()) + "%"
                  cache.evictAll()
                  listV.layoutParams = FrameLayout.LayoutParams(pageW(), MATCH)
                  (listV.adapter as? BaseAdapter)?.notifyDataSetChanged()
                  listV.setSelection(pos)
              }

              private fun toggleNight() {
                  night = !night
                  sp.edit().putBoolean("rn", night).apply()
                  val pos = maxOf(0, curPage - 1)
                  fillReader()
                  listV.adapter = PA()
                  listV.post { listV.setSelection(pos) }
                  updPage(curPage)
              }

              private fun render(p: Int, w: Int): Bitmap? {
                  val c = cache.get(p)
                  if (c != null) return c
                  val r = pdf ?: return null
                  return try {
                      val pg = r.openPage(p)
                      val h = (w * pg.height.toFloat() / pg.width).toInt()
                      val bm = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
                      bm.eraseColor(Color.WHITE)
                      pg.render(bm, null, null, PdfRenderer.Page.RENDER_MODE_FOR_DISPLAY)
                      pg.close()
                      cache.put(p, bm)
                      bm
                  } catch (e: Throwable) {
                      null
                  }
              }

              inner class PA : BaseAdapter() {
                  override fun getCount(): Int = pdf?.pageCount ?: 0
                  override fun getItem(p: Int): Any = p
                  override fun getItemId(p: Int): Long = p.toLong()
                  override fun getView(p: Int, cv: View?, parent: ViewGroup?): View {
                      val iv = (cv as? ImageView) ?: ImageView(this@MainActivity)
                      val w = pageW()
                      val bm = render(p, w)
                      iv.scaleType = ImageView.ScaleType.FIT_XY
                      if (night) { iv.colorFilter = nightF } else { iv.clearColorFilter() }
                      if (bm != null) {
                          iv.layoutParams = AbsListView.LayoutParams(w, bm.height)
                          iv.setImageBitmap(bm)
                      } else {
                          iv.layoutParams = AbsListView.LayoutParams(w, (w * 1.41f).toInt())
                          iv.setImageBitmap(null)
                      }
                      return iv
                  }
              }

              override fun onResume() {
                  super.onResume()
                  web.removeCallbacks(poller)
                  web.postDelayed(poller, 700)
              }

              override fun onPause() {
                  web.removeCallbacks(poller)
                  super.onPause()
                  saveProg()
                  syncProfile()
                  captureHome()
                  CookieManager.getInstance().flush()
              }

              override fun onDestroy() {
                  super.onDestroy()
                  closePdf()
              }

              @Suppress("DEPRECATION", "OVERRIDE_DEPRECATION")
              override fun onBackPressed() {
                  if (reader.visibility == View.VISIBLE) { if (rdFs) { rdFs = false; applyFs() } else closeReader() }
                  else if (libView.visibility == View.VISIBLE && curTab == "me" && profList != null) { profList = null; buildProfile() }
                  else if (libView.visibility == View.VISIBLE) { if (online()) goSite("home") else super.onBackPressed() }
                  else if (web.canGoBack()) web.goBack()
                  else super.onBackPressed()
              }
          }
