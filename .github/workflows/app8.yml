              private fun syncProfile() {
                  if (web.url == null) return
                  val js = "(function(){try{var s=localStorage.getItem('bbb_sess');if(!s)return JSON.stringify({s:''});var u=(JSON.parse(localStorage.getItem('bbb_users')||'{}')||{})[s]||{};var d=JSON.parse(localStorage.getItem('bbb_data_'+s)||'{}')||{};var o={s:s,n:u.n||'',L:{}};['rd','dl','lib','bmk','hist'].forEach(function(k){var a=d[k]||[];o[k]=a.length;o.L[k]=a.slice(0,60).map(function(x){return{t:x.t||'',u:x.u||'',i:x.i||'',l:x.l||'',p:x.p||0,ts:x.ts||0}})});return JSON.stringify(o)}catch(e){return ''}})()"
                  web.evaluateJavascript(js) { r ->
                      try {
                          if (r != null && r != "null") {
                              val v = JSONTokener(r).nextValue()
                              if (v is String && v.isNotEmpty()) {
                                  sp.edit().putString("prof", v).apply()
                                  profCache = null
                                  cacheCovers()
                              }
                          }
                      } catch (e: Exception) { }
                  }
              }

              private fun injectCss(v: WebView) {
                  val css = "html body #bbb .bottom-nav,html body #bbbp .bp-nav,html body #bbbp[data-bk] .bp-nav{display:none!important}html body #bbb,html body #bbbp,html body #bbb .acct,html body #bbb .mpg{padding-bottom:16px!important}html body *{-webkit-tap-highlight-color:rgba(120,160,255,.28)}html body #bbb button:active,html body #bbb a:active,html body #bbb [data-act]:active,html body #bbb [data-bu]:active,html body #bbbp button:active,html body #bbbp a:active{opacity:.72;transform:scale(.97)}"
                  v.evaluateJavascript("(function(){if(document.getElementById('appcss')||!document.head)return;var s=document.createElement('style');s.id='appcss';s.textContent='" + css + "';document.head.appendChild(s)})()", null)
              }

              @Suppress("DEPRECATION")
              private fun setupWeb() {
                  val s = web.settings
                  s.javaScriptEnabled = true
                  s.domStorageEnabled = true
                  s.setSupportMultipleWindows(false)
                  s.cacheMode = WebSettings.LOAD_DEFAULT
                  if (android.os.Build.VERSION.SDK_INT >= 33) {
                      s.isAlgorithmicDarkeningAllowed = false
                  } else if (android.os.Build.VERSION.SDK_INT >= 29) {
                      s.setForceDark(WebSettings.FORCE_DARK_OFF)
                  }
                  CookieManager.getInstance().setAcceptCookie(true)
                  web.webViewClient = object : WebViewClient() {
                      override fun shouldOverrideUrlLoading(v: WebView, r: WebResourceRequest): Boolean {
                          val u = r.url
                          if (u.scheme == "bbbapp") { handleApp(u); return true }
                          val h = u.host ?: ""
                          if (u.scheme == "http" || u.scheme == "https") {
                              if (h.endsWith(siteHost) || h.contains("google.com") || h.contains("googleusercontent.com") || h.contains("blogger.com")) return false
                          }
                          try { startActivity(Intent(Intent.ACTION_VIEW, u)) } catch (e: Exception) { }
                          return true
                      }
                      override fun shouldInterceptRequest(v: WebView, r: WebResourceRequest): WebResourceResponse? {
                          if (r.method == "GET" && !online()) {
                              val u = r.url.toString()
                              val f = File(imgDir, imgKey(u))
                              if (f.exists()) {
                                  val mf = File(imgDir, imgKey(u) + ".m")
                                  val mime = if (mf.exists()) mf.readText() else "image/jpeg"
                                  return WebResourceResponse(mime, null, f.inputStream())
                              }
                              val cf = File(coverDir, urlKey(u) + ".img")
                              if (cf.exists()) return WebResourceResponse("image/jpeg", null, cf.inputStream())
                          }
                          return super.shouldInterceptRequest(v, r)
                      }
                      override fun onPageStarted(v: WebView, url: String?, f: Bitmap?) {
                          super.onPageStarted(v, url, f)
                          pageReady = false
                          quietUntil = System.currentTimeMillis() + 4000
                          injectCss(v)
                      }
                      override fun onPageCommitVisible(v: WebView, url: String?) {
                          super.onPageCommitVisible(v, url)
                          if (snapMode) snapJs(v)
                      }
                      override fun onPageFinished(v: WebView, url: String?) {
                          super.onPageFinished(v, url)
                          injectCss(v)
                          syncProfile()
                          pageReady = true
                          if (snapMode) {
                              quietUntil = System.currentTimeMillis() + 2500
                              snapJs(v)
                              v.postDelayed({ if (snapMode && libView.visibility != View.VISIBLE) web.visibility = View.VISIBLE }, 200)
                              v.postDelayed({ if (snapMode) snapJs(v) }, 900)
                          } else {
                              quietUntil = System.currentTimeMillis() + 1800
                              hookJs(v)
                              pushPrefs(v)
                              if (isHome()) {
                                  v.postDelayed({ captureHome() }, 6000)
                                  v.postDelayed({ captureHome() }, 16000)
                              }
                          }
                      }
                      override fun onReceivedError(v: WebView, r: WebResourceRequest, e: WebResourceError) {
                          if (r.isForMainFrame) {
                              failed = true
                              tabLib()
                          }
                      }
                  }
                  web.webChromeClient = object : WebChromeClient() {
                      override fun onJsPrompt(view: WebView?, url: String?, message: String?, defaultValue: String?, result: JsPromptResult?): Boolean {
                          if (message != null && message.startsWith("bbbapp://")) {
                              handleApp(Uri.parse(message))
                              result?.confirm("")
                              return true
                          }
                          return super.onJsPrompt(view, url, message, defaultValue, result)
                      }
                  }
                  web.setDownloadListener { url, ua, cd, mime, _ -> startDownload(url, ua, cd, mime) }
              }

              private fun fileName(cd: String?): String {
                  var n = ""
                  if (cd != null) {
                      val m1 = Regex("filename\\*\\s*=\\s*[Uu][Tt][Ff]-8''([^;]+)").find(cd)
                      if (m1 != null) {
                          n = try { URLDecoder.decode(m1.groupValues[1].trim(), "UTF-8") } catch (e: Exception) { "" }
                      }
                      if (n.isEmpty()) {
                          val m2 = Regex("filename\\s*=\\s*\"?([^\";]+)\"?").find(cd)
                          if (m2 != null) n = m2.groupValues[1].trim()
                      }
                  }
                  if (n.isEmpty()) n = "book-" + System.currentTimeMillis()
                  n = n.replace(Regex("[\\\\/:*?\"<>|]"), "_")
                  if (!n.lowercase().endsWith(".pdf")) n += ".pdf"
                  return n
              }

              private fun startDownload(url: String, ua: String?, cd: String?, mime: String?) {
                  toast("⬇️ ডাউনলোড শুরু হচ্ছে…")
                  val pageUrl = web.url ?: ""
                  web.evaluateJavascript(META_JS) { r ->
                      var title = ""
                      var img = ""
                      try {
                          if (r != null && r != "null") {
                              val v = JSONTokener(r).nextValue()
                              if (v is String && v.isNotEmpty()) {
                                  val o = JSONObject(v)
                                  title = o.optString("t")
                                  img = o.optString("i")
                              }
                          }
                      } catch (e: Exception) { }
                      doDownload(url, ua, cd, pageUrl, title, img)
                  }
              }

              private fun doDownload(url: String, ua: String?, cd: String?, pageUrl: String, title: String, img: String) {
                  Thread {
                      try {
                          val c = URL(url).openConnection() as HttpURLConnection
                          c.instanceFollowRedirects = true
                          c.connectTimeout = 20000
                          c.readTimeout = 60000
                          if (ua != null) c.setRequestProperty("User-Agent", ua)
                          val ck = CookieManager.getInstance().getCookie(url)
                          if (ck != null) c.setRequestProperty("Cookie", ck)
                          c.connect()
                          if (c.responseCode !in 200..299) throw Exception("HTTP " + c.responseCode)
                          val name = fileName(c.getHeaderField("Content-Disposition") ?: cd)
                          val tmp = File(dir, "$name.part")
                          c.inputStream.use { i -> tmp.outputStream().use { o -> i.copyTo(o) } }
                          val head = ByteArray(5)
                          tmp.inputStream().use { it.read(head) }
                          if (String(head) != "%PDF-") { tmp.delete(); throw Exception("ফাইলটি PDF নয়") }
                          val dest = File(dir, name)
                          if (dest.exists()) dest.delete()
                          tmp.renameTo(dest)
                          val meta = JSONObject()
                          meta.put("t", title)
                          meta.put("i", img)
                          meta.put("u", pageUrl)
                          val ed = sp.edit().putString("m_" + name, meta.toString())
                          val pth = (Uri.parse(pageUrl).path ?: "").trimEnd('/')
                          if (pth.length > 1) ed.putString("u_" + pth, name)
                          ed.apply()
                          if (img.startsWith("http")) {
                              try {
                                  val cc = URL(img).openConnection() as HttpURLConnection
                                  cc.connectTimeout = 15000
                                  cc.readTimeout = 30000
                                  cc.inputStream.use { i -> File(coverDir, name + ".img").outputStream().use { o -> i.copyTo(o) } }
                              } catch (e: Exception) { }
                          }
                          coverCache.remove(name)
                          runOnUiThread {
                              toast("✅ সংরক্ষিত হয়েছে — “ডাউনলোড” পেজে অফলাইনে পড়তে পারবেন")
                              refreshBtn()
                              if (libView.visibility == View.VISIBLE) {
                                  if (curTab == "me") buildProfile() else buildLib()
                              }
                          }
                      } catch (e: Exception) {
                          runOnUiThread { toast("❌ ডাউনলোড হয়নি: " + (e.message ?: "")) }
                      }
                  }.start()
              }

              private fun bookTitle(f: File): String {
                  val m = sp.getString("m_" + f.name, null)
                  if (m != null) {
                      try {
                          val t = JSONObject(m).optString("t")
                          if (t.isNotEmpty()) return t
                      } catch (e: Exception) { }
                  }
                  return f.name.removeSuffix(".pdf")
              }

              private fun forgetBook(f: File) {
                  val m = sp.getString("m_" + f.name, null)
                  val ed = sp.edit().remove("p_" + f.name).remove("t_" + f.name).remove("ts_" + f.name).remove("m_" + f.name)
                  if (m != null) {
                      try {
                          val pth = (Uri.parse(JSONObject(m).optString("u")).path ?: "").trimEnd('/')
                          if (pth.length > 1) ed.remove("u_" + pth)
                      } catch (e: Exception) { }
                  }
                  ed.apply()
                  File(coverDir, f.name + ".img").delete()
                  coverCache.remove(f.name)
              }

