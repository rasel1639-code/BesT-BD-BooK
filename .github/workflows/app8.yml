              private fun localFor(u: String): File? {
                  val p = pathOf(u)
                  if (p.length <= 1) return null
                  val nm = sp.getString("u_" + p, null) ?: return null
                  val f = File(dir, nm)
                  return if (f.exists()) f else null
              }

              private fun labelFor(path: String): String {
                  val L = prof()?.optJSONObject("L") ?: return ""
                  for (k in listOf("dl", "lib", "hist", "bmk", "rd")) {
                      val a = L.optJSONArray(k) ?: continue
                      for (i in 0 until a.length()) {
                          val e = a.optJSONObject(i) ?: continue
                          if (pathOf(e.optString("u")) == path) {
                              val l = e.optString("l")
                              if (l.isNotEmpty()) return l
                          }
                      }
                  }
                  return ""
              }

              private fun authorOf(t: String, l: String): String {
                  val m = Regex("^(?:লেখক|Author)\\s*[:：]\\s*(.+)$", RegexOption.IGNORE_CASE).find(l)
                  if (m != null) return m.groupValues[1].trim()
                  val parts = t.split(Regex("\\s+[-–—]\\s+"))
                  if (parts.size >= 2) return parts.last().trim()
                  return ""
              }

              private fun cleanTitle(t: String, l: String): String {
                  if (Regex("^(?:লেখক|Author)\\s*[:：]", RegexOption.IGNORE_CASE).containsMatchIn(l)) return t
                  val parts = t.split(Regex("\\s+[-–—]\\s+"))
                  if (parts.size >= 2) return parts.dropLast(1).joinToString(" - ").trim()
                  return t
              }

              private fun decodeCover(key: String): Bitmap? {
                  val hit = coverCache.get(key)
                  if (hit != null) return hit
                  val cf = File(coverDir, key + ".img")
                  if (!cf.exists()) return null
                  return try {
                      val o = BitmapFactory.Options()
                      o.inJustDecodeBounds = true
                      BitmapFactory.decodeFile(cf.path, o)
                      var ss = 1
                      while (o.outWidth / (ss * 2) >= dp(116)) ss *= 2
                      val o2 = BitmapFactory.Options()
                      o2.inSampleSize = ss
                      val bm = BitmapFactory.decodeFile(cf.path, o2)
                      if (bm != null) coverCache.put(key, bm)
                      bm
                  } catch (e: Throwable) {
                      null
                  }
              }

              private fun coverBmp(f: File): Bitmap? = decodeCover(f.name)

              private fun urlKey(u: String): String = "u_" + Integer.toHexString(u.hashCode())

              private fun urlCover(u: String): Bitmap? = if (u.isEmpty()) null else decodeCover(urlKey(u))

              private fun cacheCovers() {
                  if (covBusy) return
                  val o = prof() ?: return
                  val L = o.optJSONObject("L") ?: return
                  val urls = LinkedHashSet<String>()
                  for (k in listOf("dl", "lib", "rd", "bmk", "hist")) {
                      val a = L.optJSONArray(k) ?: continue
                      for (i in 0 until a.length()) {
                          val e = a.optJSONObject(i) ?: continue
                          val u = e.optString("i")
                          if (u.startsWith("http")) urls.add(u)
                      }
                  }
                  covBusy = true
                  Thread {
                      var n = 0
                      for (u in urls) {
                          if (n >= 120) break
                          val f = File(coverDir, urlKey(u) + ".img")
                          if (f.exists()) continue
                          try {
                              val cc = URL(u).openConnection() as HttpURLConnection
                              cc.connectTimeout = 15000
                              cc.readTimeout = 30000
                              val tmp = File(coverDir, urlKey(u) + ".t")
                              cc.inputStream.use { i -> tmp.outputStream().use { o2 -> i.copyTo(o2) } }
                              tmp.renameTo(f)
                              n++
                          } catch (e: Exception) { }
                      }
                      covBusy = false
                      if (n > 0) runOnUiThread {
                          if (libView.visibility == View.VISIBLE) {
                              if (curTab == "me") buildProfile() else if (curTab == "dl") buildLib()
                          }
                      }
                  }.start()
              }

              private fun coverView(bmp: Bitmap?, title: String): View {
                  if (bmp != null) {
                      val iv = ImageView(this)
                      iv.setImageBitmap(bmp)
                      iv.scaleType = ImageView.ScaleType.CENTER_CROP
                      iv.clipToOutline = true
                      iv.outlineProvider = object : ViewOutlineProvider() {
                          override fun getOutline(v: View, outline: Outline) { outline.setRoundRect(0, 0, v.width, v.height, dp(8).toFloat()) }
                      }
                      return iv
                  }
                  val cv = TextView(this)
                  cv.text = title.trim().take(1).uppercase()
                  cv.gravity = Gravity.CENTER
                  cv.setTextColor(Color.WHITE)
                  cv.textSize = 24f
                  val hue = ((title.hashCode() and 0x7fffffff) % 360).toFloat()
                  val cbg = GradientDrawable()
                  cbg.setColor(Color.HSVToColor(floatArrayOf(hue, 0.6f, 0.55f)))
                  cbg.cornerRadius = dp(8).toFloat()
                  cv.background = cbg
                  return cv
              }

