                      val d = getDrawable(icons[i])!!.mutate()
                      d.setTint(cTx())
                      ib.setImageDrawable(d)
                      ib.setPadding(dp(8), dp(8), dp(8), dp(8))
                      ib.background = boxBg(11, cBg(), false)
                      row.addView(ib, LinearLayout.LayoutParams(dp(36), dp(36)))
                      val rt = TextView(this)
                      rt.text = names[i]
                      rt.setTextColor(cTx())
                      rt.textSize = 15f
                      rt.typeface = Typeface.DEFAULT_BOLD
                      rt.setPadding(dp(12), 0, 0, 0)
                      row.addView(rt, LinearLayout.LayoutParams(0, WRAP, 1f))
                      val rc = TextView(this)
                      rc.text = bn(o.optInt(keys[i]).toString())
                      rc.setTextColor(cMut())
                      rc.textSize = 13f
                      row.addView(rc)
                      val rg = TextView(this)
                      rg.text = "  ›"
                      rg.setTextColor(cMut())
                      rg.textSize = 18f
