              private fun buildProfile() {
                  libList.removeAllViews()
                  val keys = listOf("rd", "dl", "lib", "bmk", "hist")
                  val names = if (langEn) listOf("Continue reading", "Downloads", "Library", "Bookmarks", "History") else listOf("পড়া চলছে", "ডাউনলোড", "লাইব্রেরী", "বুকমার্ক", "হিস্টরি")
                  val icons = listOf(R.drawable.ic_r_rd, R.drawable.ic_r_dl, R.drawable.ic_r_lib, R.drawable.ic_r_bmk, R.drawable.ic_r_hist)
                  val pl = profList
                  val top = LinearLayout(this)
                  top.orientation = LinearLayout.HORIZONTAL
                  top.gravity = Gravity.CENTER_VERTICAL
                  top.setPadding(0, 0, 0, dp(18))
