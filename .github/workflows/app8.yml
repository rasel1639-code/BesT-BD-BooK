                  x.text = if (pl == null) "✕" else "←"
                  x.gravity = Gravity.CENTER
                  x.setTextColor(cTx())
                  x.textSize = 18f
                  x.background = boxBg(12, cPanel(), true)
                  press(x, 12)
                  x.setOnClickListener {
                      if (profList != null) { profList = null; buildProfile() } else goSite("home")
                  }
